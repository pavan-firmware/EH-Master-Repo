# =============================================================================
# EH Home — EMQX Canonical Access Control List (ACL) Configuration
# =============================================================================

# 1. Backend Service Admin Role
# Backend services with username starting with 'backend_' can publish and subscribe across the namespace
{allow, {user, "backend_service"}, all, ["eh/v1/devices/#"]}.
{allow, {username, "^backend_.*"}, all, ["eh/v1/devices/#"]}.

# 2. Device Authorization Boundary
# Each client is bound to its authenticated deviceId (${clientid} or ${username}):
# - Publish: telemetry, availability, state, events, command-receipts, ota status
{allow, all, publish, ["eh/v1/devices/${clientid}/telemetry"]}.
{allow, all, publish, ["eh/v1/devices/${clientid}/availability"]}.
{allow, all, publish, ["eh/v1/devices/${clientid}/state"]}.
{allow, all, publish, ["eh/v1/devices/${clientid}/events"]}.
{allow, all, publish, ["eh/v1/devices/${clientid}/command-receipts"]}.
{allow, all, publish, ["eh/v1/devices/${clientid}/ota"]}.

# - Subscribe: commands, ota job notifications
{allow, all, subscribe, ["eh/v1/devices/${clientid}/commands"]}.
{allow, all, subscribe, ["eh/v1/devices/${clientid}/ota"]}.

# 3. Deny All Other Wildcards and Cross-Device Access
{deny, all, all, ["#"]}.
{deny, all, all, ["eh/v1/devices/+/#"]}.
{deny, all, all, ["$SYS/#"]}.
