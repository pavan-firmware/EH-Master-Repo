version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eh_postgres
    environment:
      POSTGRES_USER: eh_admin
      POSTGRES_PASSWORD: eh_development_password_only
      POSTGRES_DB: eh_home_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eh_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8.0
    container_name: eh_emqx
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083" # Dashboard UI (admin / public)
    environment:
      EMQX_NAME: eh_emqx_node
    volumes:
      - emqx_data:/opt/emqx/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  emqx_data:
