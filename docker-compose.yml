version: '3.8'

networks:
  eh_network:
    name: eh_network
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: eh_postgres
    networks:
      - eh_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eh_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eh_development_password_only}
      POSTGRES_DB: ${POSTGRES_DB:-eh_home_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eh_admin} -d ${POSTGRES_DB:-eh_home_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eh_redis
    networks:
      - eh_network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8.0
    container_name: eh_emqx
    networks:
      - eh_network
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083" # Dashboard UI (admin / public)
    environment:
      EMQX_NAME: eh_emqx_node
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: eh_minio
    networks:
      - eh_network
    ports:
      - "9000:9000"
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio_init:
    image: minio/mc:RELEASE.2024-03-30T15-30-22Z
    container_name: eh_minio_init
    networks:
      - eh_network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing local/eh-product-assets;
      /usr/bin/mc mb --ignore-existing local/eh-firmware-artifacts;
      /usr/bin/mc mb --ignore-existing local/eh-manufacturing-labels;
      /usr/bin/mc mb --ignore-existing local/eh-database-backups;
      /usr/bin/mc anonymous set download local/eh-product-assets;
      exit 0;
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  minio_data:
