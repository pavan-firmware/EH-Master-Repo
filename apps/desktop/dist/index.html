    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #090D14;
        color: #CCCCCC;
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .app-loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background-color: #090D14;
      }
      .eh-splash-ring-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .eh-splash-svg {
        width: 100%;
        height: 100%;
        animation: ringRotate 2.2s linear infinite;
        filter: drop-shadow(0 0 8px rgba(247, 200, 82, 0.25));
      }
      @keyframes ringRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .eh-splash-center-icon {
        position: absolute;
        width: 32px;
        height: 32px;
        color: #DCAE45;
        animation: pulseIcon 2s ease-in-out infinite;
        filter: drop-shadow(0 0 6px rgba(247, 200, 82, 0.4));
      }
      @keyframes pulseIcon {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); filter: drop-shadow(0 0 10px rgba(247, 200, 82, 0.6)); }
      }
      .eh-splash-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #F7C852;
        margin-bottom: 6px;
        text-shadow: 0 0 12px rgba(247, 200, 82, 0.3);
      }
      .eh-splash-subtitle {

        letter-spacing: 0.5px;
        color: #38BDF8;
