name: EH Home Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: Node.js — Contracts, Backend, Simulator, Phase 6
  # ============================================================
  validate-contracts-and-backend:
    name: Contracts, Catalog, Simulator & Backend Tests
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Setup Node.js 20 with npm dependency cache
      # ----------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      # ----------------------------------------------------------
      # 3. Install Node dependencies deterministically
      #    MUST run before any `node` command.
      #    Fixes: "Cannot find module 'mqtt'"
      # ----------------------------------------------------------
      - name: Install Node Dependencies
        run: npm ci

      # ----------------------------------------------------------
      # 3b. Setup Python & Manufacturing PKI Dependencies
      # ----------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Cryptography
        run: pip install cryptography

      # ----------------------------------------------------------
      # 3c. Setup Java & Flutter SDK for Monorepo Suite
      # ----------------------------------------------------------
      - name: Setup Java (Android toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        working-directory: smart_home_application_v1
        run: flutter pub get

      # ----------------------------------------------------------
      # 4. Generate ephemeral development TLS/mTLS certificates
      #    Output: .local-certs/  (git-ignored, never committed)
      # ----------------------------------------------------------
      - name: Generate Development TLS/mTLS Certificates & ACL
        run: |
          node scripts/setup-emqx-mtls.js --generate-only
          chmod -R 755 .local-certs
          chmod 644 .local-certs/*

      # ----------------------------------------------------------
      # 5. Start real EMQX 5.8.0 broker with read-only certs directory
      # ----------------------------------------------------------
      - name: Start EMQX 5.8.0 Broker
        run: |
          docker run -d \
            --name eh_emqx \
            -p 1883:1883 \
            -p 8883:8883 \
            -p 18083:18083 \
            -v ${{ github.workspace }}/.local-certs:/opt/emqx/etc/local-certs:ro \
            -e EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE=/opt/emqx/etc/local-certs/ca.crt \
            -e EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE=/opt/emqx/etc/local-certs/server.crt \
            -e EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE=/opt/emqx/etc/local-certs/server.key \
            -e EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY=verify_peer \
            -e EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT=true \
            -e EMQX_LISTENERS__SSL__DEFAULT__PEER_CERT_AS_CLIENTID=cn \
            -e EMQX_AUTHORIZATION__NO_MATCH=deny \
            -e EMQX_AUTHORIZATION__CACHE__ENABLE=false \
            -e EMQX_AUTHORIZATION__SOURCES__1__TYPE=file \
            -e EMQX_AUTHORIZATION__SOURCES__1__PATH=/opt/emqx/etc/local-certs/acl.conf \
            emqx/emqx:5.8.0


      # ----------------------------------------------------------
      # 6. Wait until EMQX is ready to accept MQTT connections
      #    Polls port 1883 up to 60 s, then 3 s for full init
      # ----------------------------------------------------------
      - name: Wait for EMQX 5.8.0 to Be Ready
        run: |
          echo "Waiting for EMQX broker on port 1883..."
          READY=0
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 1883 2>/dev/null; then
              echo "EMQX port 1883 open (attempt $i)"
              READY=1
              break
            fi
            echo "  Attempt $i/30 — not ready, retrying in 2s..."
            sleep 2
          done
          if [ "$READY" -eq 0 ]; then
            echo "ERROR: EMQX did not become ready within 60s"
            docker logs eh_emqx
            exit 1
          fi
          echo "Allowing 3s for full EMQX broker initialization..."
          sleep 3
          echo "EMQX is ready."

      # ----------------------------------------------------------
      # 7. Configure EMQX: verify_peer, CN→identity, per-device ACL
      # ----------------------------------------------------------
      - name: Configure EMQX mTLS and Per-Device ACL
        run: node scripts/setup-emqx-mtls.js --configure-only

      # ----------------------------------------------------------
      # 8. Canonical contract tests
      # ----------------------------------------------------------
      - name: Run Canonical Contract Tests
        run: node packages/contracts/tests/contract-test.js

      # ----------------------------------------------------------
      # 9. Product catalog validation
      # ----------------------------------------------------------
      - name: Validate Product Catalog Definitions
        run: node product-definitions/tests/validate-products.js

      # ----------------------------------------------------------
      # 10. Device simulator compliance
      # ----------------------------------------------------------
      - name: Run Device Simulator Compliance Tests
        run: node tools/device-simulator/test-simulator.js

      # ----------------------------------------------------------
      # 11. PostgreSQL migrations parity check
      # ----------------------------------------------------------
      - name: Verify PostgreSQL Migrations Parity & Capability Sync
        run: node backend/migrations/verify-migrations.js

      # ----------------------------------------------------------
      # 12. Backend database & repository integration
      # ----------------------------------------------------------
      - name: Run Backend Database & Repository Integration Tests
        run: node backend/tests/integration.test.js

      # ----------------------------------------------------------
      # 13. Backend hardening suite
      # ----------------------------------------------------------
      - name: Run Backend Hardening Test Suite
        run: node backend/tests/hardening.test.js

      # ----------------------------------------------------------
      # 14. Product catalog service & API
      # ----------------------------------------------------------
      - name: Run Backend Product Catalog Service & API Tests
        run: node backend/tests/product-catalog.test.js

      # ----------------------------------------------------------
      # 15. Phase 4 domain model & service tests
      # ----------------------------------------------------------
      - name: Run Phase 4 Backend Domain Model & Service Tests
        run: node backend/tests/phase4-domain.test.js

      # ----------------------------------------------------------
      # 16. Phase 5 secure onboarding & claiming
      # ----------------------------------------------------------
      - name: Run Phase 5 Backend Secure Onboarding & Claiming Tests
        run: node backend/tests/phase5-onboarding.test.js

      # ----------------------------------------------------------
      # 17. Phase 6 mock / unit integration tests (40 tests)
      # ----------------------------------------------------------
      - name: Run Phase 6 MQTT Transport Unit/Mock Tests
        run: node backend/tests/phase6-mqtt.test.js

      # ----------------------------------------------------------
      # 18. Phase 6 low-level protocol harness (binary MQTT framing)
      # ----------------------------------------------------------
      - name: Run Phase 6 Low-Level MQTT Protocol Harness Tests
        run: node backend/tests/phase6-protocol-harness.test.js

      # ----------------------------------------------------------
      # 18b. Phase 6 Real EMQX TLS & mTLS Diagnostic Gate
      # ----------------------------------------------------------
      - name: Phase 6 Real EMQX TLS & mTLS Diagnostic Gate
        run: |
          set +e
          echo "=========================================================="
          echo "       PHASE 6 CI EMQX TLS & mTLS DIAGNOSTIC GATE        "
          echo "=========================================================="

          echo "--- 1. Environment ---"
          echo "Node version: $(node --version)"
          echo "OpenSSL version: $(openssl version)"
          echo "EMQX container status:"
          docker ps -f name=eh_emqx
          echo "EMQX listeners:"
          docker exec eh_emqx emqx ctl listeners
          echo "EMQX SSL listener effective configuration:"
          docker exec eh_emqx emqx eval "emqx_config:get([listeners, ssl, default])."

          echo "--- 2. Host Certificates Verification ---"
          echo "CA Subject & Fingerprint:"
          openssl x509 -in .local-certs/ca.crt -noout -subject -issuer -fingerprint -sha256
          echo "Server Cert Subject, Issuer, SAN, EKU & Fingerprint:"
          openssl x509 -in .local-certs/server.crt -noout -subject -issuer -fingerprint -sha256 -ext subjectAltName -ext extendedKeyUsage
          echo "Device A Cert Subject, Issuer, EKU & Fingerprint:"
          openssl x509 -in .local-certs/device_a.crt -noout -subject -issuer -fingerprint -sha256 -ext extendedKeyUsage
          echo "OpenSSL Verify Server Cert against CA:"
          openssl verify -CAfile .local-certs/ca.crt .local-certs/server.crt
          echo "OpenSSL Verify Device A Cert against CA:"
          openssl verify -CAfile .local-certs/ca.crt .local-certs/device_a.crt

          echo "--- 3. Container Certificates Verification ---"
          echo "Container cert files & permissions:"
          docker exec eh_emqx ls -la /opt/emqx/etc/certs/
          echo "Local CA fingerprint:"
          openssl x509 -in .local-certs/ca.crt -noout -fingerprint -sha256
          echo "Container cacert.pem fingerprint:"
          docker exec eh_emqx openssl x509 -in /opt/emqx/etc/certs/cacert.pem -noout -fingerprint -sha256
          echo "Local server_fullchain.pem fingerprint:"
          openssl x509 -in .local-certs/server_fullchain.pem -noout -fingerprint -sha256
          echo "Container cert.pem fingerprint:"
          docker exec eh_emqx openssl x509 -in /opt/emqx/etc/certs/cert.pem -noout -fingerprint -sha256

          echo "--- 4. Served Certificate Chain on Port 8883 ---"
          echo Q | openssl s_client -connect 127.0.0.1:8883 -servername localhost -showcerts || true

          echo "--- 5. OpenSSL s_client mTLS Tests Outside mqtt.js ---"
          echo "[A] Valid Device A mTLS connect test:"
          echo Q | openssl s_client -connect 127.0.0.1:8883 -servername localhost -CAfile .local-certs/ca.crt -cert .local-certs/device_a.crt -key .local-certs/device_a.key -verify_return_error -brief || echo "OpenSSL valid mTLS failed!"

          echo "[B] Negative case — missing client cert:"
          echo Q | openssl s_client -connect 127.0.0.1:8883 -servername localhost -CAfile .local-certs/ca.crt -verify_return_error -brief 2>&1 || echo "Rejected as expected (missing client cert)"

          echo "[C] Negative case — untrusted CA:"
          echo Q | openssl s_client -connect 127.0.0.1:8883 -servername localhost -CAfile .local-certs/untrusted_ca.crt -cert .local-certs/device_a.crt -key .local-certs/device_a.key -verify_return_error -brief 2>&1 || echo "Rejected as expected (untrusted CA)"

          echo "[D] Negative case — untrusted client cert:"
          echo Q | openssl s_client -connect 127.0.0.1:8883 -servername localhost -CAfile .local-certs/ca.crt -cert .local-certs/untrusted_device.crt -key .local-certs/untrusted_device.key -verify_return_error -brief 2>&1 || echo "Rejected as expected (untrusted client cert)"

          echo "--- 6. Raw Node tls.connect & Standalone mqtt.js Probe ---"
          node scripts/ci-tls-probe.js

          echo "=========================================================="

      # ----------------------------------------------------------
      # 18c. EMQX ACL State Diagnostic (pre-integration-test gate)
      #      Print active authorization sources and loaded ACL rules.
      #      Runs with || true so it never blocks the test step.
      # ----------------------------------------------------------
      - name: Verify EMQX ACL State Before Integration Tests
        run: |
          echo "=========================================================="
          echo "     EMQX 5.8.0 ACL STATE PRE-INTEGRATION DIAGNOSTIC     "
          echo "=========================================================="

          echo "--- Authorization no_match setting ---"
          docker exec eh_emqx emqx eval "emqx_config:get([authorization, no_match])." || true

          echo "--- Authorization cache setting ---"
          docker exec eh_emqx emqx eval "emqx_config:get([authorization, cache])." || true

          echo "--- Active authorization sources (via REST API) ---"
          docker exec eh_emqx wget -q -O- \
            --header="Authorization: Basic YWRtaW46cHVibGlj" \
            http://localhost:18083/api/v5/authorization/sources || true

          echo "--- Effective ACL file in /opt/emqx/etc/acl.conf ---"
          docker exec eh_emqx cat /opt/emqx/etc/acl.conf || true

          echo "--- Effective ACL file in /opt/emqx/data/authz/acl.conf ---"
          docker exec eh_emqx cat /opt/emqx/data/authz/acl.conf 2>/dev/null || echo "(not present)"

          echo "--- EMQX listener peer_cert_as_clientid setting ---"
          docker exec eh_emqx emqx eval \
            "emqx_config:get([listeners, ssl, default, peer_cert_as_clientid])." || true

          echo "=========================================================="

      # ----------------------------------------------------------
      # 19a. Phase 7A Authentication & Authorization Tests
      # ----------------------------------------------------------
      - name: Run Phase 7A Backend Auth & Authorization Tests
        run: node backend/tests/phase7a-auth.test.js

      # ----------------------------------------------------------
      # 19b. Phase 7B Realtime SSE & Worker Integration Tests
      # ----------------------------------------------------------
      - name: Run Phase 7B Realtime SSE & Worker Integration Tests
        run: node backend/tests/phase7b-realtime.test.js

      # ----------------------------------------------------------
      # 19c. Phase 10 Automation, Scenes & Scheduler Engine Tests
      # ----------------------------------------------------------
      - name: Run Phase 10 Automation, Scenes & Scheduler Tests
        run: node backend/tests/phase10-automation.test.js

      # ----------------------------------------------------------
      # 19d. Phase 11 Device Management, Health & Observability Tests
      # ----------------------------------------------------------
      - name: Run Phase 11 Device Management & Observability Tests
        run: node backend/tests/phase11-device-management.test.js

      # ----------------------------------------------------------
      # 19e. Phase 12 Environment Configuration Validation
      # ----------------------------------------------------------
      - name: Run Phase 12 Environment Configuration Validation
        run: node scripts/validate-environment.js

      # ----------------------------------------------------------
      # 19f. Phase 13 Production Deployment & Operational Security Tests
      # ----------------------------------------------------------
      - name: Run Phase 13 Production Deployment & Security Tests
        run: node backend/tests/phase13-production-deployment.test.js

      # ----------------------------------------------------------
      # 19g. Complete Monorepo 24-Suite Regression Runner
      # ----------------------------------------------------------
      - name: Run Complete Monorepo 24-Suite Validation Runner
        run: node scripts/validate-repo.js

      # ----------------------------------------------------------
      # 20. Phase 6 REAL EMQX 5.8.0 integration — HARD CI GATE
      #     No || true. No continue-on-error.
      #     Broker unavailable / TLS / mTLS / ACL / command /
      #     receipt / telemetry / LWT / reconnect failure → CI FAILS.
      # ----------------------------------------------------------
      - name: Run Phase 6 Real EMQX 5.8.0 Integration Tests
        run: node backend/tests/phase6-emqx-integration.test.js 2>&1 | tee test-results.log

      # ----------------------------------------------------------
      # 20. Dump EMQX logs on any failure for diagnosis
      # ----------------------------------------------------------
      - name: Dump EMQX Broker Logs on Failure
        if: failure()
        run: |
          echo "=========================================================="
          echo "            INTEGRATION TEST FAILURE REPORT               "
          echo "=========================================================="
          cat test-results.log 2>/dev/null || echo "(no test log file)"
          echo "=========================================================="
          echo "                   EMQX BROKER LOGS                       "
          echo "=========================================================="
          docker logs eh_emqx

  # ============================================================
  # JOB 2: Flutter — fully independent, no Node deps
  # ============================================================
  validate-flutter-app:
    name: Flutter Analyze & Test (smart_home_application_v1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart_home_application_v1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (Android toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Test Suite (Unit, Widget, Capability Engine & Onboarding)
        run: flutter test
